name: Upstream pg_dump TAP

on:
  push:
    paths:
      - '.github/workflows/upstream-tap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tap:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        pg_version: ["13.23", "14.24", "15.19", "16.15", "17.11", "18.6"]
    env:
      PG_VERSION: ${{ matrix.pg_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install TAP build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential bison flex libreadline-dev zlib1g-dev libssl-dev \
            libipc-run-perl libtest-simple-perl perl ca-certificates curl

      - name: Build pristine upstream server and pg_dump
        run: |
          set -euo pipefail
          tag="REL_${PG_VERSION//./_}"
          mkdir -p "$RUNNER_TEMP/upstream"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/postgres.tar.gz" \
            "https://codeload.github.com/postgres/postgres/tar.gz/refs/tags/$tag"
          tar xzf "$RUNNER_TEMP/postgres.tar.gz" -C "$RUNNER_TEMP/upstream"
          src="$RUNNER_TEMP/upstream/postgres-$tag"
          cd "$src"
          ./configure --without-icu --without-readline --enable-tap-tests >configure.log 2>&1
          make -j2 >build.log 2>&1
          echo "VANILLA=$src" >> "$GITHUB_ENV"

      - name: Run upstream pg_dump TAP suite
        working-directory: ${{ env.VANILLA }}
        run: |
          set -euo pipefail
          make -C src/bin/pg_dump check
